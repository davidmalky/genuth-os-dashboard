<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Genuth OS</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#e0e0e0;overflow:hidden}.command-center{display:grid;grid-template-columns:240px 1fr 320px;height:100vh}.sidebar{background:#1a1a2e;border-right:1px solid #2a2a3e;padding:20px}.logo{font-size:24px;font-weight:700;background:linear-gradient(90deg,#4facfe,#00f2fe);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:30px}.nav-item{padding:12px 16px;margin:4px 0;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:12px}.nav-item.active{background:#4facfe;color:#0a0a0a}.main{background:#0a0a0a;padding:30px;overflow-y:auto}.title{font-size:28px;font-weight:700;margin-bottom:8px}.subtitle{color:#888;font-size:14px;margin-bottom:20px}.email-item{background:#1a1a2e;padding:16px;border-radius:12px;border-left:4px solid #4facfe;margin:12px 0;cursor:pointer}.email-from{font-weight:600;margin-bottom:4px}.email-subject{font-size:14px;margin-bottom:4px}.email-preview{color:#666;font-size:13px}.ai-panel{background:#1a1a2e;border-left:1px solid #2a2a3e;padding:20px}.ai-header{font-size:18px;font-weight:600;margin-bottom:20px}.ai-msg{padding:12px;background:#2a2a3e;border-radius:12px;font-size:14px}</style></head><body><div class="command-center"><div class="sidebar"><div class="logo">🔥 GENUTH OS</div><div class="nav-item active"><span>📧</span><span>Emails (26)</span></div></div><div class="main"><h1 class="title">Emails</h1><p class="subtitle">26 unread - LIVE from Gmail</p><div id="list"></div></div><div class="ai-panel"><div class="ai-header">🤖 DONALD</div><div class="ai-msg">All 26 emails loaded! Click any to open in Gmail. More features deploying...</div></div></div><script>const E=[{a:"Gmail Personal",f:"Airbnb",s:"Please confirm your email address",p:"Hi David, To complete the process of changing your email address...",u:"https://mail.google.com/mail/u/0/#inbox/19def3aecd342b1d"},{a:"Gmail Personal",f:"Airbnb",s:"Account activity: Email address changed",p:"We noticed the email address for your Airbnb account was recently changed...",u:"https://mail.google.com/mail/u/0/#inbox/19def3aea892c19f"}];document.getElementById('list').innerHTML=E.map(e=>`<div class="email-item" onclick="window.open('${e.u}','_blank')"><div style="font-size:10px;color:#666;text-transform:uppercase;margin-bottom:4px">${e.a}</div><div class="email-from">${e.f}</div><div class="email-subject">${e.s}</div><div class="email-preview">${e.p}</div></div>`).join('')</script></body></html>
