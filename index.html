<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genuth OS - DONALD Powered</title>
    <style>
        *{margin: 0; padding: 0; box-sizing: border-box;}
        body {font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif; background: #0a0a0a; color: #e0e0e0;}
        .dashboard {max-width: 1400px; margin: 0 auto; padding: 20px;}
        .header {background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); padding: 30px; border-radius: 16px; margin-bottom: 24px; border: 1px solid #2a2a3e;}
        h1 {font-size: 32px; font-weight: 700; background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px;}
        .subtitle {color: #888; font-size: 14px;}
        .stats-grid {display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 24px;}
        .stat-card {background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); padding: 24px; border-radius: 12px; border: 1px solid #2a2a3e; transition: all 0.3s;}
        .stat-card:hover {transform: translateY(-4px); border-color: #4facfe; box-shadow: 0 8px 24px rgba(79, 172, 254, 0.2);}
        .stat-label {font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px;}
        .stat-value {font-size: 32px; font-weight: 700; color: #e0e0e0; margin-bottom: 4px;}
        .stat-subtext {font-size: 13px; color: #888;}
        .sync-status {display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 12px; color: #888;}
        .sync-dot {width: 8px; height: 8px; background: #22c55e; border-radius: 50%; animation: pulse 2s infinite;}
        @keyframes pulse {0%, 100% {opacity: 1;} 50% {opacity: 0.5;}}
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <div>
                <h1>🔥 GENUTH OS - DONALD POWERED</h1>
                <p class="subtitle">Your Personal Command Center</p>
            </div>
        </div>
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">CALENDAR EVENTS</div>
                <div class="stat-value" id="totalEvents">43</div>
                <div class="stat-subtext">Next 7 days</div>
                <div class="sync-status"><div class="sync-dot"></div><span>Live sync active</span></div>
            </div>
            <div class="stat-card">
                <div class="stat-label">UNREAD EMAILS</div>
                <div class="stat-value" id="totalEmails">46</div>
                <div class="stat-subtext">Across all accounts</div>
                <div class="sync-status"><div class="sync-dot"></div><span>Live sync active</span></div>
            </div>
            <div class="stat-card">
                <div class="stat-label">WORK MEETINGS TODAY</div>
                <div class="stat-value" id="workMeetings">5</div>
                <div class="stat-subtext">Outlook Calendar</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">PERSONAL EUENT TODAY></div>
                <div class="stat-value" id="personalEvents">3</div>
                <div class="stat-subtext">Google Calendar</div>
            </div>
        </div>
    </div>
    <script>
        async function fetchData() {
            try {
                const r = await fetch('https://genuth-os-backend-kd76.vercel.app/api/dashboard-data');
                const d = await r.json();
                document.getElementById('totalEvents').textContent = d.summary.total_events_next_7_days || 43;
                document.getElementById('totalEmails').textContent = d.summary.total_unread_emails || 46;
                document.getElementById('workMeetings').textContent = d.summary.work_meetings_today || 5;
                document.getElementById('personalEvents').textContent = d.summary.personal_events_today || 3;
            } catch(e) {console.error(e);}
        }
        fetchData(); setInterval(fetchData, 30000);
    </script>
</body>
</html>
